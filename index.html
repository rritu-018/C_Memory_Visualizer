<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="app-base-path" content="/C_Memory_Visualizer/">
  <meta name="description" content="Open a shared C memory visualizer workspace by name.">
  <title>Open a C Memory Visualizer workspace</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; color: #e9eef4; background: #09111f; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(38rem 30rem at 90% 0%, rgba(24,97,140,.25), transparent 70%), radial-gradient(38rem 30rem at 0% 100%, rgba(82,111,42,.18), transparent 70%), #09111f; }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid rgba(203,221,241,.14); border-radius: 20px; background: rgba(18,32,49,.88); box-shadow: 0 24px 70px rgba(0,0,0,.3); }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 6vw, 32px); letter-spacing: -.04em; }
    p { margin: 0 0 24px; color: #96a1af; line-height: 1.6; }
    form { display: flex; gap: 10px; }
    input { min-width: 0; flex: 1; height: 48px; padding: 0 14px; border: 1px solid rgba(203,221,241,.2); border-radius: 10px; outline: none; color: #e9eef4; background: #0a1423; font: inherit; }
    input:focus { border-color: #c9fb72; box-shadow: 0 0 0 3px rgba(201,251,114,.1); }
    button { height: 48px; padding: 0 20px; border: 0; border-radius: 10px; color: #14200a; background: #c9fb72; font: inherit; font-weight: 750; cursor: pointer; transition: transform .16s, background .16s; }
    button:hover { transform: translateY(-1px); background: #d6ff91; }
    button:focus-visible { outline: 2px solid #64d9ff; outline-offset: 3px; }
    #message { min-height: 1.4em; margin: 12px 2px 0; color: #ff9a86; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>C Memory Visualizer</h1>
    <p>Choose a workspace name to open or create its shared C canvas.</p>
    <form id="workspaceForm">
      <input id="workspaceSlug" name="workspace" aria-label="Workspace name" placeholder="e.g. pointers-demo" maxlength="64" autocomplete="off" required>
      <button type="submit">Go</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script>
    const form = document.getElementById('workspaceForm');
    const field = document.getElementById('workspaceSlug');
    const message = document.getElementById('message');
    const appBase = document.querySelector('meta[name="app-base-path"]').content;
    form.addEventListener('submit', event => {
      event.preventDefault();
      const slug = field.value.trim().toLowerCase();
      if (!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(slug)) {
        message.textContent = 'Use 1–64 letters, numbers, hyphens, or underscores; start with a letter or number.';
        field.focus();
        return;
      }
      window.location.assign(`${appBase}${encodeURIComponent(slug)}`);
    });
  </script>
</body>
</html>
